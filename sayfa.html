<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2ee57a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="canonical" id="canonicalLink" href="https://gekkotari.com/sayfa.html">
    <title>Kurumsal & Yasal - Gekkotari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="description" content="Gekkotari oyun portalı hakkında kurumsal bilgiler, gizlilik politikası, kullanım şartları ve DMCA.">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="assets/css/style.css?v=14">
    <meta name="google-adsense-account" content="ca-pub-7220337370405776">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7220337370405776" crossorigin="anonymous"></script>
</head>
<body>

<div id="siteHeaderMount"></div>

<main class="container-xl my-5">
    <div class="row g-4 justify-content-center">
        <div class="col-lg-3">
            <div class="page-content p-3">
                <h6 class="footer-title mb-3">Kurumsal Sayfalar</h6>
                <div class="d-grid gap-2" id="pageNavList">
                    <a href="sayfa.html?slug=hakkimizda" class="filter-btn" data-slug="hakkimizda"><i class="fas fa-info-circle"></i> Hakkımızda</a>
                    <a href="sayfa.html?slug=gizlilik" class="filter-btn" data-slug="gizlilik"><i class="fas fa-user-shield"></i> Gizlilik &amp; Çerezler</a>
                    <a href="sayfa.html?slug=kullanim-sartlari" class="filter-btn" data-slug="kullanim-sartlari"><i class="fas fa-file-contract"></i> Kullanım Şartları</a>
                    <a href="sayfa.html?slug=telif-dmca" class="filter-btn" data-slug="telif-dmca"><i class="fas fa-balance-scale"></i> Telif &amp; DMCA</a>
                </div>
            </div>
        </div>
        <div class="col-lg-9">
            <div class="page-content" id="pageContentBox"></div>
        </div>
    </div>
</main>

<div id="siteFooterMount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ads-config.js?v=13"></script>
<script src="assets/js/supabase-sync.js?v=12"></script>
<script src="assets/js/games-data.js?v=24"></script>
<script src="assets/js/common.js?v=22"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderHeader('sayfa.html');
    renderFooter();

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug') || 'hakkimizda';
    const pages = getPages();
    const page = pages.find(p => p.slug === slug) || pages[0];

    document.querySelectorAll('#pageNavList a').forEach(a => {
        if (a.getAttribute('data-slug') === (page ? page.slug : slug)) a.classList.add('active');
    });

    if (page) {
        document.title = page.baslik + ' - Gekkotari';
        const canon = document.getElementById('canonicalLink');
        if (canon) canon.href = 'https://gekkotari.com/sayfa.html?slug=' + encodeURIComponent(page.slug);
        document.getElementById('pageContentBox').innerHTML = `
            <h1 class="mb-4" style="color: var(--primary-bright); font-weight: 800; font-size: 1.8rem;">${escapeHtml(page.baslik)}</h1>
            <div style="font-size: 1rem;">${page.icerik}</div>
            <hr class="border-secondary my-4" style="opacity:0.25;">
            <div class="d-flex gap-2 flex-wrap">
                <a href="index.html" class="btn btn-primary-custom"><i class="fas fa-arrow-left me-2"></i>Ana Sayfaya Dön</a>
                <button onclick="openFeedbackModal('Oneri', '')" class="btn btn-outline-success"><i class="fas fa-envelope me-2"></i>İletişim / Kaldırma Talebi</button>
            </div>
        `;
    }
});
</script>
</body>
</html>
