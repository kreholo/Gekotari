<script>
const RUFFLE_VERSION = '0.7.1';
const RUFFLE_CDN_LIST = [
    `https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@${RUFFLE_VERSION}/ruffle.js`,
    `https://unpkg.com/@ruffle-rs/ruffle@${RUFFLE_VERSION}/ruffle.js`
];
const LEADERBOARD_GAME_IDS = new Set(['16', '211', '212', '213', '214', '215']);

let currentGame = null;
let scrollLockEnabled = true;
let ruffleScriptPromise = null;
let activeRufflePlayer = null;
let isRuffleMuted = false;
let ruffleQuality = 'high';
try {
    const savedQ = localStorage.getItem('gekkotari_ruffle_quality');
    if (savedQ === 'low' || savedQ === 'high') ruffleQuality = savedQ;
} catch {}

function loadScriptWithTimeout(src, timeoutMs = 8500) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        let settled = false;
        const timer = setTimeout(() => {
            if (!settled) {
                settled = true;
                s.remove();
                reject(new Error('CDN zaman aşımı: ' + src));
            }
        }, timeoutMs);

        s.onload = () => {
            const waitReady = (tries = 0) => {
                if (settled) return;
                if (window.RufflePlayer && typeof window.RufflePlayer.newest === 'function') {
                    settled = true;
                    clearTimeout(timer);
                    resolve();
                } else if (tries > 50) {
                    settled = true;
                    clearTimeout(timer);
                    reject(new Error('Ruffle başlatılamadı'));
                } else {
                    setTimeout(() => waitReady(tries + 1), 80);
                }
            };
            waitReady();
        };
        s.onerror = () => {
            if (!settled) {
                settled = true;
                clearTimeout(timer);
                s.remove();
                reject(new Error('Script yüklenemedi: ' + src));
            }
        };
        document.head.appendChild(s);
    });
}

async function ensureRuffleLoaded() {
    if (window.RufflePlayer && typeof window.RufflePlayer.newest === 'function') return;
    if (!ruffleScriptPromise) {
        ruffleScriptPromise = (async () => {
            for (const cdn of RUFFLE_CDN_LIST) {
                try {
                    await loadScriptWithTimeout(cdn, 8500);
                    return;
                } catch {}
            }
            ruffleScriptPromise = null;
            throw new Error('Ruffle emülatörü tüm CDN kaynaklarından yüklenemedi');
        })();
    }
    return ruffleScriptPromise;
}

window.addEventListener('keydown', (e) => {
    if (!scrollLockEnabled) return;
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
    }
}, { passive: false });

function toggleScrollLock() {
    scrollLockEnabled = !scrollLockEnabled;
    const btn = document.getElementById('scrollLockBtn');
    btn.innerHTML = scrollLockEnabled
        ? '<i class="fas fa-lock me-1"></i>Tuş Kilidi: Açık'
        : '<i class="fas fa-unlock me-1"></i>Tuş Kilidi: Kapalı';
    btn.className = scrollLockEnabled ? 'btn btn-sm btn-outline-success' : 'btn btn-sm btn-dark border-secondary';
}

function toggleVirtualGamepad() {
    const panel = document.getElementById('virtualGamepadPanel');
    const btn = document.getElementById('vpadToggleBtn');
    const isOpen = panel.classList.toggle('show');
    btn.className = isOpen ? 'btn btn-sm btn-outline-success' : 'btn btn-sm btn-dark border-secondary';
}

function bindVirtualGamepad() {
    const buttons = document.querySelectorAll('#virtualGamepadPanel .vpad-btn');
    function fireKey(type, btn) {
        const key = btn.getAttribute('data-key');
        const code = btn.getAttribute('data-code');
        const kc = parseInt(btn.getAttribute('data-kc'), 10);
        const evt = new KeyboardEvent(type, {
            key,
            code,
            keyCode: kc,
            which: kc,
            bubbles: true,
            cancelable: true
        });
        const target = activeRufflePlayer || document.getElementById('oyunAlani') || document;
        try { target.focus(); } catch {}
        target.dispatchEvent(evt);
    }
    buttons.forEach(btn => {
        if (btn.dataset.bound) return;
        btn.dataset.bound = '1';
        const down = (e) => {
            e.preventDefault();
            btn.classList.add('pressed');
            fireKey('keydown', btn);
        };
        const up = (e) => {
            e.preventDefault();
            btn.classList.remove('pressed');
            fireKey('keyup', btn);
        };
        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', (e) => {
            if (btn.classList.contains('pressed')) up(e);
        });
    });
}

function toggleRuffleMute() {
    isRuffleMuted = !isRuffleMuted;
    const btn = document.getElementById('muteBtn');
    btn.innerHTML = isRuffleMuted
        ? '<i class="fas fa-volume-mute me-1 text-danger"></i>Ses: Kapalı'
        : '<i class="fas fa-volume-up me-1"></i>Ses: Açık';
    if (activeRufflePlayer) {
        try { activeRufflePlayer.volume = isRuffleMuted ? 0 : 1; } catch {}
    }
}

function toggleRuffleQuality() {
    ruffleQuality = ruffleQuality === 'high' ? 'low' : 'high';
    try { localStorage.setItem('gekkotari_ruffle_quality', ruffleQuality); } catch {}
    updateQualityButtonUi();
    showToast('info', `Flash kalitesi "${ruffleQuality === 'high' ? 'Yüksek' : 'Düşük (Hızlı)'}" olarak ayarlandı, oyun yeniden başlatılıyor.`);
    if (currentGame) mountGameEngine(currentGame);
}

function updateQualityButtonUi() {
    const btn = document.getElementById('qualityBtn');
    if (!btn) return;
    btn.innerHTML = ruffleQuality === 'high'
        ? '<i class="fas fa-sliders-h me-1"></i>Kalite: Yüksek'
        : '<i class="fas fa-tachometer-alt me-1 text-info"></i>Kalite: Hızlı';
}

function toggleCinemaMode() {
    const active = document.body.classList.toggle('cinema-mode');
    const btn = document.getElementById('cinemaBtn');
    btn.innerHTML = active
        ? '<i class="fas fa-sun me-1"></i>Işıkları Aç'
        : '<i class="fas fa-moon me-1"></i>Işıkları Kapat';
}

function toggleWideMode() {
    const stage = document.getElementById('playerStageCol');
    const sidebar = document.getElementById('playerSidebarCol');
    const btn = document.getElementById('wideBtn');
    const isWide = stage.classList.contains('col-lg-12');
    if (isWide) {
        stage.classList.replace('col-lg-12', 'col-lg-9');
        sidebar.style.display = '';
        btn.innerHTML = '<i class="fas fa-arrows-alt-h me-1"></i>Geniş Mod';
    } else {
        stage.classList.replace('col-lg-9', 'col-lg-12');
        sidebar.style.display = 'none';
        btn.innerHTML = '<i class="fas fa-compress-alt me-1"></i>Normal Mod';
    }
}

function paylasOyunu() {
    if (!currentGame) return;
    const url = 'https://gekkotari.com' + getGameUrl(currentGame);
    if (navigator.share) {
        navigator.share({ title: currentGame.oyun_adi + ' - Gekkotari', url }).catch(() => {});
        return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
            showToast('success', 'Oyun bağlantısı panoya kopyalandı! Arkadaşına atabilirsin.');
        });
    } else {
        prompt('Oyunu arkadaşınla paylaşmak için bağlantıyı kopyala:', url);
    }
}

function tamEkranYap() {
    const elem = document.getElementById('oyunAlani');
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
}

function oyunuYenidenYukle() {
    if (currentGame) mountGameEngine(currentGame);
}

function updateStatsUi(st) {
    if (!st) return;
    document.getElementById('oynamaSayisiGosterge').innerText = formatNumber(st.plays);
    document.getElementById('puanGosterge').innerText = st.rating > 0
        ? `${st.rating.toFixed(1)} (${st.ratingCount})`
        : 'Henüz puan yok';
}

async function puanVer() {
    if (!currentGame) return;
    const p = prompt('Bu oyuna kaç puan verirsin? (1 ile 5 arasında bir tam sayı girin):', '5');
    if (p === null || p.trim() === '') return;
    const num = Math.round(Number(p));
    if (!(num >= 1 && num <= 5)) {
        showToast('warning', 'Lütfen 1 ile 5 arasında bir puan girin.');
        return;
    }

    if (window.GekkotariDB) {
        try {
            const st = await window.GekkotariDB.submitRemoteRating(currentGame.id, num);
            if (st) {
                updateStatsUi(st);
                showToast('success', `Puanınız ortak veritabanına kaydedildi! Yeni ortalama: ${st.rating.toFixed(1)}`);
                return;
            }
        } catch (err) {
            if (String(err && err.message || '').includes('RATE_LIMIT')) {
                showToast('warning', 'Bu oyuna yakın zamanda zaten puan verdin.');
                return;
            }
        }
    }
    showToast('danger', 'Puan şu an kaydedilemedi, lütfen tekrar dene.');
}

async function mountGameEngine(oyun) {
    const container = document.getElementById('oyunAlani');
    container.innerHTML = '';
    activeRufflePlayer = null;
    const link = (oyun.oyun_linki || '').trim();

    if (link.toLowerCase().endsWith('.swf')) {
        container.innerHTML = `
            <div id="ruffle-container" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                <div class="text-muted small"><i class="fas fa-spinner fa-spin me-2"></i>Flash emülatörü (Ruffle ${RUFFLE_VERSION}) yükleniyor...</div>
            </div>`;
        const ruffleBox = document.getElementById('ruffle-container');
        const origin = window.location.origin;

        const rewriteRules = [
            [/^https?:\/\/[^/]*cpmstar\.com\/.*adviewas2.*/i, origin + '/assets/stub-as2.swf'],
            [/^https?:\/\/[^/]*cpmstar\.com\/.*/i, origin + '/assets/stub.swf'],
            [/^https?:\/\/[^/]*mochi(?:ads|bot)\.com\/.*/i, origin + '/assets/stub-as2.swf'],
            [/^https?:\/\/[^/]*fliplineads\.com\/.*\.swf/i, origin + '/assets/stub-as2.swf'],
            [/^https?:\/\/[^/]*agi\.armorgames\.com\/.*\.swf/i, origin + '/assets/stub.swf'],
            [/^https?:\/\/[^/]*kongregate\.com\/flash\/.*/i, origin + '/assets/stub.swf'],
            [/^https?:\/\/[^/]*mindjolt\.com\/.*\.swf/i, origin + '/assets/stub.swf'],
            [/^https?:\/\/[^/]*spilapi.*/i, origin + '/assets/stub.swf'],
            [/^https?:\/\/[^/]*fliplineads\.com\/.*/i, origin + '/assets/stub.txt'],
            [/^https?:\/\/[^/]*playtomic\.com\/.*/i, origin + '/assets/stub.txt'],
            [/^https?:\/\/[^/]*swfstats\.com\/.*/i, origin + '/assets/stub.txt'],
            [/^https?:\/\/[^/]*miniclip\.com\/.*/i, origin + '/assets/stub.txt']
        ];

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: 'on',
            unmuteOverlay: 'visible',
            splashScreen: true,
            warnOnUnsupportedContent: false,
            letterbox: 'on',
            scale: 'showAll',
            quality: ruffleQuality,
            openUrlMode: 'deny',
            allowNetworking: 'all',
            urlRewriteRules: rewriteRules
        };

        try {
            await ensureRuffleLoaded();
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = '100%';
            player.style.height = '100%';
            ruffleBox.innerHTML = '';
            ruffleBox.appendChild(player);
            activeRufflePlayer = player;
            if (isRuffleMuted) {
                try { player.volume = 0; } catch {}
            }

            const proxyUrl = link.startsWith('http')
                ? '/api/swf-proxy?url=' + encodeURIComponent(link)
                : resolveAssetUrl(link);
            const loadOpts = {
                url: proxyUrl,
                autoplay: 'on',
                unmuteOverlay: 'visible',
                warnOnUnsupportedContent: false,
                letterbox: 'on',
                scale: 'showAll',
                quality: ruffleQuality,
                openUrlMode: 'deny',
                allowNetworking: 'all',
                urlRewriteRules: rewriteRules
            };
            if (link.startsWith('https://')) {
                const baseDir = link.substring(0, link.lastIndexOf('/') + 1);
                loadOpts.base = origin + '/p/' + baseDir.replace(/^https:\/\//i, 'https/');
            }

            await player.load(loadOpts);
        } catch (err) {
            ruffleBox.innerHTML = `
                <div class="text-center p-4">
                    <div class="text-danger fw-bold mb-2"><i class="fas fa-exclamation-triangle me-1"></i>Oyun şu an yüklenemedi</div>
                    <p class="small text-muted mb-3">Geçici bir ağ gecikmesi yaşanmış olabilir. Yeniden deneyebilir veya sorunu bildirebilirsin.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" onclick="oyunuYenidenYukle()" class="btn btn-sm btn-primary-custom">Yeniden Dene</button>
                        <button type="button" onclick="openFeedbackModal('Sorun Bildir', ${JSON.stringify(oyun.oyun_adi)})" class="btn btn-sm btn-outline-warning">Sorunu Bildir</button>
                    </div>
                </div>`;
        }
        return;
    }

    const embedLink = resolveAssetUrl(link);
    container.innerHTML = `
        <iframe src="${escapeHtml(embedLink)}"
                sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-orientation-lock"
                allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                style="width:100%; height:100%; border:none;"></iframe>
    `;
}

async function renderComments(oyunId) {
    const el = document.getElementById('commentsList');
    let list = [];
    if (window.GekkotariDB) {
        try {
            list = await window.GekkotariDB.fetchRemoteComments(oyunId);
        } catch {}
    }

    if (!list.length) {
        el.innerHTML = `<div class="text-muted small py-3 text-center" style="border:1px dashed var(--border-color);border-radius:10px;">Henüz yorum yapılmamış. İlk yorumu sen yaz!</div>`;
        return;
    }

    el.innerHTML = list.map(y => {
        const dt = y.created_at ? new Date(y.created_at).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        return `
        <div class="d-flex mb-3 p-3 rounded" style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);">
            <div class="me-3">
                <div class="rounded-circle d-flex align-items-center justify-content-center text-dark fw-bold"
                     style="width: 38px; height: 38px; background: var(--primary);">
                    ${escapeHtml((y.author || 'O').charAt(0).toUpperCase())}
                </div>
            </div>
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <h6 class="text-white mb-0">${escapeHtml(y.author)}</h6>
                    <small class="text-muted">${escapeHtml(dt)}</small>
                </div>
                <p class="mb-0" style="font-size: 0.94rem; color: var(--text-secondary);">${escapeHtml(y.body)}</p>
            </div>
        </div>`;
    }).join('');
}

async function renderLeaderboard(oyunId) {
    const sec = document.getElementById('leaderboardSection');
    const listEl = document.getElementById('leaderboardList');
    if (!sec || !listEl || !LEADERBOARD_GAME_IDS.has(String(oyunId))) return;
    sec.style.display = 'block';

    try {
        const rows = await window.GekkotariDB.fetchTopScores(oyunId, 10);
        if (!rows.length) {
            listEl.innerHTML = '<div class="text-muted small py-2">Henüz kayıtlı skor yok. İlk rekoru sen kır!</div>';
            return;
        }
        const unitLabel = String(oyunId) === '16' ? 'Seviye ' : '';
        const unitSuffix = String(oyunId) === '16' ? '' : ' puan';
        listEl.innerHTML = rows.map((r, i) => `
            <div class="lb-row">
                <div class="d-flex align-items-center gap-2">
                    <span class="badge ${i === 0 ? 'bg-warning text-dark' : i === 1 ? 'bg-light text-dark' : i === 2 ? 'bg-secondary' : 'bg-dark border border-secondary'}">#${i + 1}</span>
                    <strong class="text-white">${escapeHtml(r.player_name)}</strong>
                </div>
                <span class="fw-bold" style="color:var(--primary);">${unitLabel}${formatNumber(r.score)}${unitSuffix}</span>
            </div>
        `).join('');
    } catch {
        listEl.innerHTML = '<div class="text-muted small">Skor tablosu şu an yüklenemedi.</div>';
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    renderHeader('oyun.html');
    renderFooter();
    renderAdSlot('playerBottomAd', 'player_bottom');
    renderAdSlot('playerSidebarAd', 'player_sidebar');
    bindVirtualGamepad();

    // Global overrides mevcutsa önce birleştir
    if (window.GekkotariDB && window.GekkotariDB.fetchCatalogOverrides) {
        try {
            const ov = await window.GekkotariDB.fetchCatalogOverrides();
            if (Array.isArray(ov) && ov.length) window.GEKKOTARI_REMOTE_OVERRIDES = ov;
        } catch {}
    }

    const params = new URLSearchParams(window.location.search);
    const games = getGames();

    if (params.get('random') === '1') {
        const rand = games[Math.floor(Math.random() * games.length)];
        window.location.replace(getGameUrl(rand));
        return;
    }

    const pathMatch = window.location.pathname.match(/^\/oyun\/([^/?#]+)$/);
    const slugFromPath = pathMatch ? decodeURIComponent(pathMatch[1]) : '';
    const initId = window.__INITIAL_GAME_ID__ || params.get('id');
    const slugParam = params.get('slug') || slugFromPath;
    const adParam = params.get('ad');

    if (initId) currentGame = games.find(g => String(g.id) === String(initId));
    if (!currentGame && slugParam) currentGame = games.find(g => getGameSlug(g) === slugParam);
    if (!currentGame && adParam) currentGame = games.find(g => (g.oyun_adi || '').toLowerCase().includes(adParam.toLowerCase()));
    if (!currentGame) currentGame = games[0];

    // Adres çubuğunu temiz slug URL'e güncelle
    if (window.location.protocol !== 'file:' && window.location.pathname === '/oyun.html' && currentGame) {
        try { window.history.replaceState(null, '', getGameUrl(currentGame)); } catch {}
    }

    recordRecentPlay(currentGame.id);

    const gameCanonical = 'https://gekkotari.com' + (window.location.protocol !== 'file:' ? getGameUrl(currentGame) : '/oyun/' + getGameSlug(currentGame));
    const descText = currentGame.aciklama || (currentGame.oyun_adi + ' oyununu Gekkotari üzerinden ücretsiz ve tam ekran oyna!');
    const keywordsList = (currentGame.anahtar_kelimeler || `${currentGame.oyun_adi}, ${currentGame.kategori_adi}, ücretsiz tarayıcı oyunu`).split(',').map(s => s.trim()).filter(Boolean);
    document.title = currentGame.oyun_adi + ' Oyna - Gekkotari';

    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', descText);
    const metaKw = document.querySelector('meta[name="keywords"]');
    if (metaKw) metaKw.setAttribute('content', keywordsList.join(', '));
    const canon = document.getElementById('canonicalLink');
    if (canon) canon.setAttribute('href', gameCanonical);
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute('content', currentGame.oyun_adi + ' Oyna - Gekkotari');
    const ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.setAttribute('content', descText);
    const ogUrl = document.querySelector('meta[property="og:url"]');
    if (ogUrl) ogUrl.setAttribute('content', gameCanonical);
    const ogImg = document.querySelector('meta[property="og:image"]');
    if (ogImg) {
        ogImg.setAttribute('content', currentGame.gorsel && currentGame.gorsel.startsWith('http') ? currentGame.gorsel : ('https://gekkotari.com/' + currentGame.gorsel));
    }

    // Breadcrumb UI
    const catHref = pageHref('kategori.html?tur=' + encodeURIComponent(currentGame.kategori_adi));
    document.getElementById('bcCatLink').href = catHref;
    document.getElementById('bcCatLink').textContent = currentGame.kategori_adi;
    document.getElementById('bcGameTitle').textContent = currentGame.oyun_adi;

    const tagsEl = document.getElementById('gameTagsMount');
    if (tagsEl && keywordsList.length) {
        tagsEl.style.display = 'block';
        tagsEl.innerHTML = '<div class="small fw-bold mb-1 text-muted"><i class="fas fa-tags me-1" style="color:var(--primary);"></i>Etiketler</div>' +
            keywordsList.slice(0, 8).map(t => `<a href="${pageHref('kategori.html?arama=' + encodeURIComponent(t))}" class="badge bg-dark border border-secondary text-decoration-none text-light me-1 mb-1">${escapeHtml(t)}</a>`).join('');
    }

    document.getElementById('gameTitleHeading').innerHTML = `<i class="${escapeHtml(getGameIcon(currentGame))}"></i> ${escapeHtml(currentGame.oyun_adi)}`;
    document.getElementById('puanGosterge').innerText = 'Henüz puan yok';
    document.getElementById('oynamaSayisiGosterge').innerText = '...';
    document.getElementById('etiketBadge').innerText = currentGame.etiket || 'Popüler';
    document.getElementById('gameDescription').innerText = descText;
    document.getElementById('gameTipText').innerText = currentGame.ipucu || 'Tam ekran veya Işıkları Kapat modunu kullanarak oyuna odaklanabilirsin.';
    document.getElementById('gameControlsText').innerHTML = `<i class="fas fa-gamepad"></i> <span>${escapeHtml(currentGame.kontroller || 'Fare / Klavye')}</span>`;
    document.getElementById('addLibBtn').onclick = () => kutuphaneyeEkle(currentGame.id);

    const isSwf = (currentGame.oyun_linki || '').toLowerCase().endsWith('.swf');
    if (isSwf) {
        document.getElementById('ruffleSaveTip').style.display = 'block';
        document.getElementById('vpadToggleBtn').style.display = '';
        document.getElementById('muteBtn').style.display = '';
        document.getElementById('qualityBtn').style.display = '';
        updateQualityButtonUi();
    }

    const mods = Array.isArray(currentGame.modlar) ? currentGame.modlar : [];
    const platEl = document.getElementById('platformBadgesMount');
    let platHtml = isSwf
        ? `<span class="badge bg-dark border border-secondary"><i class="fas fa-bolt text-warning me-1"></i>Flash (Klavye/Fare)</span>`
        : `<span class="badge bg-dark border border-secondary"><i class="fab fa-html5 text-info me-1"></i>HTML5 (PC &amp; Mobil)</span>`;
    if (mods.includes('2 Kişilik')) {
        platHtml += `<span class="badge bg-success"><i class="fas fa-user-friends me-1"></i>Aynı Ekranda 2 Kişilik</span>`;
    }
    platEl.innerHTML = platHtml;

    const mobBanner = document.getElementById('mobileTipBanner');
    const mobText = document.getElementById('mobileTipText');
    if (mobBanner && mobText) {
        mobBanner.style.removeProperty('display');
        mobText.innerText = isSwf
            ? 'Bu klasik Flash oyunu klavye için tasarlanmıştır; yukarıdaki "Sanal Tuşlar" butonunu açabilir veya bilgisayarda oynayabilirsin.'
            : 'Daha geniş oyun alanı için telefonunuzu yan çevirebilirsiniz.';
    }

    // Seri İçi Önceki/Sonraki + Alt Seri Izgarası
    if (currentGame.seri) {
        const allSeries = games
            .filter(g => g.seri === currentGame.seri)
            .sort((a, b) => (a.oyun_adi || '').localeCompare(b.oyun_adi || '', 'tr', { numeric: true }));
        const idx = allSeries.findIndex(g => String(g.id) === String(currentGame.id));
        if (allSeries.length > 1) {
            const strip = document.getElementById('seriesNavStrip');
            const prevG = idx > 0 ? allSeries[idx - 1] : null;
            const nextG = idx >= 0 && idx < allSeries.length - 1 ? allSeries[idx + 1] : null;
            strip.style.display = 'flex';
            strip.innerHTML = `
                <div>
                    ${prevG ? `<a href="${getGameUrl(prevG)}" class="btn btn-sm btn-outline-light"><i class="fas fa-chevron-left me-1"></i>Önceki: ${escapeHtml(prevG.oyun_adi)}</a>` : `<span class="text-muted small"><i class="fas fa-layer-group me-1" style="color:var(--primary);"></i>Serideki Bölüm ${idx + 1}/${allSeries.length}</span>`}
                </div>
                <div>
                    ${nextG ? `<a href="${getGameUrl(nextG)}" class="btn btn-sm btn-outline-success">Sonraki: ${escapeHtml(nextG.oyun_adi)}<i class="fas fa-chevron-right ms-1"></i></a>` : `<span class="text-muted small">Serinin Son Bölümü (${allSeries.length}/${allSeries.length})</span>`}
                </div>
            `;
        }
        const siblings = allSeries.filter(g => String(g.id) !== String(currentGame.id));
        if (siblings.length > 0) {
            document.getElementById('seriesSection').style.display = 'block';
            document.getElementById('seriesGamesGrid').innerHTML = siblings.map(g => renderGameCard(g, 'col')).join('');
        }
    }

    // Kullanıcı Adı Hazırla
    const user = getActiveUser();
    if (user) {
        document.getElementById('yorumYazar').value = user.kullanici_adi || user.ad_soyad;
    }

    // Skor Tablosu Kurulumu (Yerli Oyunlar İçin)
    const lbInput = document.getElementById('lbPlayerNameInput');
    const savedLbName = (() => {
        try { return localStorage.getItem('gekkotari_player_name') || ''; } catch { return ''; }
    })();
    if (lbInput) {
        lbInput.value = savedLbName || (user ? (user.kullanici_adi || user.ad_soyad) : '');
        document.getElementById('lbSaveNameBtn').addEventListener('click', () => {
            const val = lbInput.value.trim();
            if (val.length < 2) {
                showToast('warning', 'Rumuz en az 2 karakter olmalıdır.');
                return;
            }
            try { localStorage.setItem('gekkotari_player_name', val); } catch {}
            showToast('success', 'Skor rumuzun kaydedildi: ' + val);
        });
    }

    if (LEADERBOARD_GAME_IDS.has(String(currentGame.id))) {
        renderLeaderboard(currentGame.id);
        window.addEventListener('message', async (ev) => {
            if (ev.origin !== window.location.origin) return;
            const d = ev.data;
            if (!d || d.type !== 'gekkotari_score') return;
            if (String(d.gameId) !== String(currentGame.id)) return;
            const scoreNum = Math.round(Number(d.score || 0));
            if (!(scoreNum >= 1)) return;

            let pName = (lbInput && lbInput.value.trim()) || '';
            if (pName.length < 2) {
                const asked = prompt(`Tebrikler! Skorun (${scoreNum}) küresel tabloya kaydedilsin. Rumuzunu yaz:`, 'Oyuncu');
                if (!asked || asked.trim().length < 2) return;
                pName = asked.trim().slice(0, 32);
                if (lbInput) lbInput.value = pName;
                try { localStorage.setItem('gekkotari_player_name', pName); } catch {}
            }

            try {
                await window.GekkotariDB.submitGameScore(currentGame.id, pName, scoreNum);
                showToast('success', `Skorun küresel tabloya kaydedildi (${scoreNum})!`);
                await renderLeaderboard(currentGame.id);
            } catch {}
        });
    }

    document.getElementById('yorumFormu').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('yorumSubmitBtn');
        const yazar = document.getElementById('yorumYazar').value.trim() || 'Misafir Oyuncu';
        const metin = document.getElementById('yorumMetni').value.trim();
        if (!metin) return;

        btn.disabled = true;
        try {
            await window.GekkotariDB.postRemoteComment(currentGame.id, yazar, metin);
            document.getElementById('yorumMetni').value = '';
            await renderComments(currentGame.id);
            showToast('success', 'Yorumun paylaşıldı!');
        } catch (err) {
            const msg = String(err && err.message || '');
            if (msg.includes('SPAM_LINK')) showToast('warning', 'Güvenlik nedeniyle yorumlarda bağlantı veya HTML paylaşılamaz.');
            else if (msg.includes('DUPLICATE_COMMENT')) showToast('warning', 'Aynı yorumu zaten paylaştın.');
            else if (msg.includes('RATE_LIMIT')) showToast('warning', 'Çok hızlı yorum gönderiyorsun, biraz bekle.');
            else showToast('danger', 'Yorum gönderilemedi, lütfen tekrar dene.');
        } finally {
            btn.disabled = false;
        }
    });

    const similars = games
        .filter(g => g.kategori_adi === currentGame.kategori_adi && String(g.id) !== String(currentGame.id))
        .slice(0, 5);
    document.getElementById('similarGamesContainer').innerHTML = similars.map(b => {
        const hasImg = b.gorsel && b.gorsel !== 'default_game.png' && (b.gorsel.startsWith('http') || b.gorsel.startsWith('assets/'));
        return `
        <div class="game-card mb-2 p-2">
            <a href="${getGameUrl(b)}" class="d-flex align-items-center gap-2 text-decoration-none">
                <div style="width:58px;height:44px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg, ${b.renk || getCategoryColor(b.kategori_adi)}, var(--bg-darker));display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;">
                    <i class="${escapeHtml(getGameIcon(b))} text-white"></i>
                    ${hasImg
                        ? `<img src="${escapeHtml(resolveAssetUrl(b.gorsel))}" alt="${escapeHtml(b.oyun_adi)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';">`
                        : ''}
                </div>
                <div class="flex-grow-1 overflow-hidden">
                    <h4 class="game-title mb-0" style="font-size:0.84rem;">${escapeHtml(b.oyun_adi)}</h4>
                    <span class="game-category d-block" style="font-size:0.72rem;">${escapeHtml(b.kategori_adi)}</span>
                </div>
                <span class="btn btn-play btn-sm px-2" style="width:auto;"><i class="fas fa-play"></i></span>
            </a>
        </div>`;
    }).join('');

    mountGameEngine(currentGame);
    renderComments(currentGame.id);
    if (window.GekkotariDB) {
        window.GekkotariDB.recordRemotePlay(currentGame.id)
            .then(st => { if (st) updateStatsUi(st); })
            .catch(() => { document.getElementById('oynamaSayisiGosterge').innerText = '0'; });
        syncPortalLiveStats();
    }
});
</script>
</body>
</html>
