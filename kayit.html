<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2ee57a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <title>Kayıt Ol - Gekkotari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=14">
</head>
<body>

<div id="siteHeaderMount"></div>

<main class="container">
    <div class="auth-container">
        <div class="text-center mb-4">
            <div class="auth-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h3>Aramıza Katıl</h3>
            <p class="text-muted">Ücretsiz Gekkotari hesabı oluştur, kütüphaneni bulutta sakla</p>
        </div>

        <form id="kayitFormu">
            <div class="mb-3">
                <label class="form-label" for="ad_soyad">Ad Soyad</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-user"></i></span>
                    <input type="text" id="ad_soyad" class="form-control custom-input" placeholder="Adınız Soyadınız" required minlength="2">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="kullanici_adi">Rumuz (Kullanıcı Adı)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-at"></i></span>
                    <input type="text" id="kullanici_adi" class="form-control custom-input" placeholder="OyuncuRumuzu" required minlength="2" maxlength="32">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">E-posta Adresi</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control custom-input" placeholder="ornek@email.com" required autocomplete="email">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="sifre">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" id="sifre" class="form-control custom-input" placeholder="En az 6 karakter" required minlength="6" autocomplete="new-password">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="sifre_tekrar">Şifre Tekrar</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" id="sifre_tekrar" class="form-control custom-input" placeholder="Şifrenizi tekrarlayın" required autocomplete="new-password">
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="kurallar" required>
                <label class="form-check-label small" for="kurallar">
                    <a href="sayfa.html?slug=kullanim-sartlari" class="text-decoration-none" style="color:var(--primary);">Kullanım şartlarını</a> ve <a href="sayfa.html?slug=gizlilik" class="text-decoration-none" style="color:var(--primary);">gizlilik politikasını</a> kabul ediyorum
                </label>
            </div>

            <button type="submit" id="registerSubmitBtn" class="btn btn-primary-custom w-100 py-2">
                <i class="fas fa-user-plus me-2"></i>Kayıt Ol
            </button>
        </form>

        <div id="registerStatusBox" class="alert alert-info mt-3 small" style="display:none;"></div>

        <div class="mt-4 text-center">
            <a href="giris.html" class="text-decoration-none" style="color: var(--primary);">
                Zaten hesabın var mı? <strong>Giriş Yap</strong>
            </a>
            <br>
            <a href="index.html" class="text-muted text-decoration-none small mt-2 d-inline-block">
                <i class="fas fa-arrow-left me-1"></i> Ana Sayfaya Dön
            </a>
        </div>
    </div>
</main>

<div id="siteFooterMount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ads-config.js?v=13"></script>
<script src="assets/js/supabase-sync.js?v=12"></script>
<script src="assets/js/games-data.js?v=26"></script>
<script src="assets/js/common.js?v=24"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderHeader('kayit.html');
    renderFooter();

    const box = document.getElementById('registerStatusBox');

    document.getElementById('kayitFormu').addEventListener('submit', async (e) => {
        e.preventDefault();
        const adSoyad = document.getElementById('ad_soyad').value.trim();
        const kadi = document.getElementById('kullanici_adi').value.trim();
        const email = document.getElementById('email').value.trim();
        const sifre = document.getElementById('sifre').value;
        const sifre2 = document.getElementById('sifre_tekrar').value;

        if (sifre !== sifre2) {
            showToast('danger', 'Şifreler eşleşmiyor!');
            return;
        }

        const btn = document.getElementById('registerSubmitBtn');
        btn.disabled = true;
        box.style.display = 'none';

        try {
            const result = await window.GekkotariDB.authSignUp({
                email,
                password: sifre,
                username: kadi,
                fullName: adSoyad
            });

            if (result.needsEmailConfirm) {
                box.className = 'alert alert-success mt-3 small';
                box.textContent = 'Hesabın oluşturuldu! E-posta adresine gönderilen doğrulama linkine tıkladıktan sonra giriş yapabilirsin.';
                box.style.display = 'block';
                document.getElementById('kayitFormu').reset();
                showToast('success', 'Doğrulama maili gönderildi!');
            } else {
                showToast('success', 'Kayıt başarılı! Hoş geldin ' + adSoyad);
                setTimeout(() => { window.location.href = pageHref('index.html'); }, 600);
            }
        } catch (err) {
            const raw = String(err && err.message || '');
            let msg = 'Kayıt tamamlanamadı: ' + raw;
            if (raw.toLowerCase().includes('already registered')) {
                msg = 'Bu e-posta adresi zaten kayıtlı! Giriş sayfasından devam edebilirsin.';
            }
            box.className = 'alert alert-danger mt-3 small';
            box.textContent = msg;
            box.style.display = 'block';
        } finally {
            btn.disabled = false;
        }
    });
});
</script>
</body>
</html>
