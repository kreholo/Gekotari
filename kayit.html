<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Gekkotari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=11">
</head>
<body>

<div id="siteHeaderMount"></div>

<main class="container">
    <div class="auth-container">
        <div class="text-center mb-4">
            <div class="auth-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h3>Aramıza Katıl</h3>
            <p class="text-muted">Ücretsiz hesap oluştur ve oynamaya başla</p>
        </div>

        <form id="kayitFormu">
            <div class="mb-3">
                <label class="form-label" for="ad_soyad">Ad Soyad</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-user"></i></span>
                    <input type="text" id="ad_soyad" class="form-control custom-input" placeholder="Adınız Soyadınız" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="kullanici_adi">Kullanıcı Adı</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-at"></i></span>
                    <input type="text" id="kullanici_adi" class="form-control custom-input" placeholder="KullaniciAdi123" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">E-posta Adresi</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control custom-input" placeholder="ornek@email.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="sifre">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" id="sifre" class="form-control custom-input" placeholder="En az 6 karakter" required minlength="6">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="sifre_tekrar">Şifre Tekrar</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" id="sifre_tekrar" class="form-control custom-input" placeholder="Şifrenizi tekrarlayın" required>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="kurallar" required>
                <label class="form-check-label small" for="kurallar">
                    <a href="sayfa.html?slug=kullanim-sartlari" class="text-decoration-none" style="color:var(--primary);">Kullanım şartlarını</a> kabul ediyorum
                </label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2">
                <i class="fas fa-user-plus me-2"></i>Kayıt Ol
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="giris.html" class="text-decoration-none" style="color: var(--primary);">
                Zaten hesabın var mı? <strong>Giriş Yap</strong>
            </a>
            <br>
            <a href="index.html" class="text-muted text-decoration-none small mt-2 d-inline-block">
                <i class="fas fa-arrow-left me-1"></i> Ana Sayfaya Dön
            </a>
        </div>
    </div>
</main>

<div id="siteFooterMount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ads-config.js?v=9"></script>
<script src="assets/js/supabase-sync.js?v=9"></script>
<script src="assets/js/games-data.js?v=13"></script>
<script src="assets/js/common.js?v=10"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderHeader('kayit.html');
    renderFooter();

    document.getElementById('kayitFormu').addEventListener('submit', (e) => {
        e.preventDefault();
        const adSoyad = document.getElementById('ad_soyad').value.trim();
        const kadi = document.getElementById('kullanici_adi').value.trim();
        const email = document.getElementById('email').value.trim();
        const sifre = document.getElementById('sifre').value.trim();
        const sifre2 = document.getElementById('sifre_tekrar').value.trim();

        if (sifre !== sifre2) {
            showToast('danger', 'Şifreler eşleşmiyor!');
            return;
        }

        const users = getUsers();
        if (users.some(u => u.email.toLowerCase() === email.toLowerCase() || u.kullanici_adi.toLowerCase() === kadi.toLowerCase())) {
            showToast('warning', 'Bu e-posta veya kullanıcı adı zaten kayıtlı!');
            return;
        }

        const newUser = {
            id: Date.now(),
            ad_soyad: adSoyad,
            kullanici_adi: kadi,
            email: email,
            sifre: sifre,
            rol_adi: 'user',
            olusturma_tarihi: new Date().toISOString()
        };
        users.push(newUser);
        saveUsers(users);
        setActiveUser(newUser);
        showToast('success', 'Kayıt başarılı! Hoş geldin ' + adSoyad + ' 🎉');
        setTimeout(() => { window.location.href = 'index.html'; }, 700);
    });
});
</script>
</body>
</html>
