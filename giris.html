<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Gekkotari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="siteHeaderMount"></div>

<main class="container">
    <div class="auth-container">
        <div class="text-center mb-4">
            <div class="auth-icon">
                <i class="fas fa-user"></i>
            </div>
            <h3>Tekrar Hoş Geldin</h3>
            <p class="text-muted">Hesabınla giriş yap ve oynamaya başla</p>
        </div>

        <form id="girisFormu">
            <div class="mb-3">
                <label class="form-label" for="email">Kullanıcı Adı veya E-posta</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="text" id="email" class="form-control custom-input" placeholder="Kullanıcı adı veya e-posta" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="sifre">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="sifre" class="form-control custom-input" placeholder="••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                    <label class="form-check-label small" for="rememberMe">Beni Hatırla</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2">
                <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="kayit.html" class="text-decoration-none" style="color: var(--primary);">
                Hesabın yok mu? <strong>Hemen Kayıt Ol</strong>
            </a>
            <br>
            <a href="index.html" class="text-muted text-decoration-none small mt-2 d-inline-block">
                <i class="fas fa-arrow-left me-1"></i> Ana Sayfaya Dön
            </a>
        </div>
    </div>
</main>

<div id="siteFooterMount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ads-config.js"></script>
<script src="assets/js/games-data.js"></script>
<script src="assets/js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderHeader('giris.html');
    renderFooter();

    document.getElementById('girisFormu').addEventListener('submit', (e) => {
        e.preventDefault();
        const girilen = document.getElementById('email').value.trim();
        const sifre = document.getElementById('sifre').value.trim();

        const users = getUsers();
        const found = users.find(u =>
            (u.email.toLowerCase() === girilen.toLowerCase() || u.kullanici_adi.toLowerCase() === girilen.toLowerCase()) &&
            u.sifre === sifre
        );

        if (found) {
            setActiveUser(found);
            showToast('success', 'Hoş geldin, ' + found.ad_soyad + '! 🎮');
            setTimeout(() => { window.location.href = 'index.html'; }, 600);
        } else {
            showToast('danger', 'Kullanıcı adı/e-posta veya şifre hatalı!');
        }
    });
});
</script>
</body>
</html>
