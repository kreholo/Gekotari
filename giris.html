<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2ee57a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <title>Giriş Yap - Gekkotari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=14">
</head>
<body>

<div id="siteHeaderMount"></div>

<main class="container">
    <div class="auth-container">
        <div class="text-center mb-4">
            <div class="auth-icon">
                <i class="fas fa-user"></i>
            </div>
            <h3 id="authTitleHeading">Tekrar Hoş Geldin</h3>
            <p class="text-muted" id="authSubtitleText">E-posta ve şifrenle giriş yap; kütüphanen tüm cihazlarında senkron kalsın</p>
        </div>

        <form id="girisFormu">
            <div class="mb-3">
                <label class="form-label" for="email">E-posta Adresi</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="email" class="form-control custom-input" placeholder="ornek@email.com" required autocomplete="email">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="sifre">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="sifre" class="form-control custom-input" placeholder="••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <button type="button" id="forgotPwBtn" class="btn btn-link btn-sm p-0 text-decoration-none" style="color:var(--primary);">
                    Şifremi Unuttum
                </button>
                <button type="button" id="resendConfirmBtn" class="btn btn-link btn-sm p-0 text-muted text-decoration-none">
                    Onay Mailini Tekrar Gönder
                </button>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-primary-custom w-100 py-2">
                <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
            </button>
        </form>

        <!-- ŞİFRE SIFIRLAMA FORMU (Mail sıfırlama linkiyle dönüldüğünde açılır) -->
        <form id="recoveryForm" style="display:none;">
            <div class="mb-3">
                <label class="form-label" for="newPw">Yeni Şifre</label>
                <input type="password" id="newPw" class="form-control custom-input" placeholder="En az 6 karakter" required minlength="6" autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label" for="newPw2">Yeni Şifre Tekrar</label>
                <input type="password" id="newPw2" class="form-control custom-input" placeholder="Yeni şifreyi tekrarla" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" id="saveRecoveryBtn" class="btn btn-primary-custom w-100 py-2">
                <i class="fas fa-key me-2"></i>Yeni Şifreyi Kaydet
            </button>
        </form>

        <div id="authStatusAlert" class="alert alert-info mt-3 small" style="display:none;"></div>

        <div class="mt-4 text-center">
            <a href="kayit.html" class="text-decoration-none" style="color: var(--primary);">
                Hesabın yok mu? <strong>Hemen Kayıt Ol</strong>
            </a>
            <br>
            <a href="index.html" class="text-muted text-decoration-none small mt-2 d-inline-block">
                <i class="fas fa-arrow-left me-1"></i> Ana Sayfaya Dön
            </a>
        </div>
    </div>
</main>

<div id="siteFooterMount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ads-config.js?v=13"></script>
<script src="assets/js/supabase-sync.js?v=12"></script>
<script src="assets/js/games-data.js?v=27"></script>
<script src="assets/js/common.js?v=25"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderHeader('giris.html');
    renderFooter();

    const statusBox = document.getElementById('authStatusAlert');
    const mode = new URLSearchParams(window.location.search).get('mode');
    const loginForm = document.getElementById('girisFormu');
    const recoveryForm = document.getElementById('recoveryForm');

    if (mode === 'recovery') {
        loginForm.style.display = 'none';
        recoveryForm.style.display = 'block';
        document.getElementById('authTitleHeading').textContent = 'Yeni Şifre Belirle';
        document.getElementById('authSubtitleText').textContent = 'Hesabın için yeni şifreni aşağıya yazabilirsin.';
    }

    recoveryForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('newPw').value;
        const p2 = document.getElementById('newPw2').value;
        if (p1 !== p2) {
            showToast('danger', 'Şifreler eşleşmiyor.');
            return;
        }
        const btn = document.getElementById('saveRecoveryBtn');
        btn.disabled = true;
        try {
            await window.GekkotariDB.authUpdatePassword(p1);
            showToast('success', 'Şifren güncellendi! Yönlendiriliyorsun...');
            setTimeout(() => { window.location.href = pageHref('index.html'); }, 700);
        } catch (err) {
            statusBox.className = 'alert alert-danger mt-3 small';
            statusBox.textContent = 'Şifre güncellenemedi: ' + (err.message || 'Lütfen tekrar şifre sıfırlama bağlantısı iste.');
            statusBox.style.display = 'block';
        } finally {
            btn.disabled = false;
        }
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const sifre = document.getElementById('sifre').value;
        const btn = document.getElementById('loginSubmitBtn');
        btn.disabled = true;
        statusBox.style.display = 'none';

        try {
            const user = await window.GekkotariDB.authSignIn({ email, password: sifre });
            showToast('success', 'Hoş geldin, ' + (user.ad_soyad || user.kullanici_adi) + '!');
            const nextUrl = new URLSearchParams(window.location.search).get('next') || (user.isAdmin ? 'admin.html' : 'index.html');
            setTimeout(() => {
                window.location.href = pageHref(nextUrl);
            }, 500);
        } catch (err) {
            const raw = String(err && err.message || '');
            let msg = 'E-posta veya şifre hatalı.';
            if (raw.toLowerCase().includes('email not confirmed')) {
                msg = 'E-posta adresin henüz doğrulanmamış. Gelen kutunu kontrol et veya "Onay Mailini Tekrar Gönder" bağlantısını kullan.';
            } else if (raw.toLowerCase().includes('rate')) {
                msg = 'Çok fazla deneme yaptın, lütfen biraz bekleyip tekrar dene.';
            }
            statusBox.className = 'alert alert-danger mt-3 small';
            statusBox.textContent = msg;
            statusBox.style.display = 'block';
        } finally {
            btn.disabled = false;
        }
    });

    document.getElementById('forgotPwBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        if (!email) {
            showToast('warning', 'Şifre sıfırlama için önce yukarıya e-posta adresini yaz.');
            return;
        }
        try {
            await window.GekkotariDB.authRecover(email);
            statusBox.className = 'alert alert-info mt-3 small';
            statusBox.textContent = 'Şifre sıfırlama bağlantısı e-posta adresine gönderildi (spam klasörünü de kontrol et).';
            statusBox.style.display = 'block';
        } catch {
            showToast('danger', 'Sıfırlama maili şu an gönderilemedi.');
        }
    });

    document.getElementById('resendConfirmBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        if (!email) {
            showToast('warning', 'Onay maili için önce yukarıya e-posta adresini yaz.');
            return;
        }
        try {
            await window.GekkotariDB.authResendConfirm(email);
            statusBox.className = 'alert alert-info mt-3 small';
            statusBox.textContent = 'Doğrulama bağlantısı e-posta adresine yeniden gönderildi.';
            statusBox.style.display = 'block';
        } catch {
            showToast('danger', 'Doğrulama maili şu an gönderilemedi.');
        }
    });
});
</script>
</body>
</html>
