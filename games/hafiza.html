<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hafıza Kart Eşleştirme - Gekkotari</title>
<style>
  :root { --bg:#0b1120; --panel:#131c31; --bd:rgba(255,255,255,0.12); --acc:#2ee57a; --txt:#f8fafc; --mut:#94a3b8; }
  * { box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:4px; width:100%; height:100%; background:radial-gradient(circle at top,#172544 0%,var(--bg) 78%); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .shell { width:min(97vw,480px); max-height:98vh; background:var(--panel); border:1px solid var(--bd); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; box-shadow:0 20px 50px rgba(0,0,0,0.48); }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; }
  .brand { font-weight:800; font-size:0.95rem; color:var(--acc); }
  select,button { font-family:inherit; font-weight:700; font-size:0.75rem; border-radius:8px; border:1px solid var(--bd); background:#1a2540; color:var(--txt); padding:4px 8px; cursor:pointer; }
  .btn-go { background:linear-gradient(135deg,#2ee57a,#16a34a); color:#052211; border:none; }
  .stats { display:flex; justify-content:space-between; font-size:0.8rem; font-weight:700; background:rgba(255,255,255,0.04); padding:5px 10px; border-radius:9px; }
  .grid { display:grid; gap:6px; width:min(100%, 48vh, 270px); margin:0 auto; aspect-ratio:1/1; }
  .card { background:#1d2a48; border:2px solid rgba(255,255,255,0.1); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; cursor:pointer; transition:transform 0.14s,background 0.14s; }
  .card.open { background:#0f172a; border-color:#38bdf8; }
  .card.done { background:rgba(46,229,122,0.14); border-color:var(--acc); cursor:default; }
  .foot { text-align:center; font-size:0.75rem; color:#fde047; font-weight:600; min-height:16px; }
</style>
</head>
<body>
<div class="shell">
  <div class="hud">
    <span class="brand">🧠 Hafıza Kartları</span>
    <div style="display:flex;gap:5px;">
      <select id="szSel"><option value="16">4×4 Kolay</option><option value="20">5×4 Usta</option></select>
      <button id="newBtn" class="btn-go" type="button">↻ Yenile</button>
    </div>
  </div>
  <div class="stats">
    <span>Hamle: <strong id="mv">0</strong></span>
    <span>Eşleşen: <strong id="mt">0</strong></span>
    <span>Süre: <strong id="tm">0</strong> sn</span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="msg" class="foot">Kartları çevir, bütün ikon çiftlerini en az hamlede eşleştir!</div>
</div>
<script>
const EMOJIS = ['🔥','💧','⚡','🚀','💎','🎮','🦊','🐉','🛡️','👑','🍀','🎯'];
let cards = [], open = [], locked = false, moves = 0, matched = 0, totalPairs = 8, secs = 0, timer = null;

function start() {
  if (timer) clearInterval(timer);
  const cnt = parseInt(document.getElementById('szSel').value, 10) || 16;
  totalPairs = cnt / 2;
  const pick = EMOJIS.slice(0, totalPairs);
  cards = [...pick, ...pick].map((v, i) => ({ id: i, v, open: false, done: false }));
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  open = []; locked = false; moves = 0; matched = 0; secs = 0;
  document.getElementById('tm').textContent = '0';
  document.getElementById('msg').textContent = 'Aynı çiftleri bul!';
  timer = setInterval(() => { secs++; document.getElementById('tm').textContent = secs; }, 1000);
  render();
}

function render() {
  const g = document.getElementById('grid');
  g.style.gridTemplateColumns = totalPairs > 8 ? 'repeat(5, 1fr)' : 'repeat(4, 1fr)';
  g.style.aspectRatio = totalPairs > 8 ? '5 / 4' : '1 / 1';
  g.innerHTML = '';
  document.getElementById('mv').textContent = moves;
  document.getElementById('mt').textContent = `${matched}/${totalPairs}`;
  cards.forEach((c, idx) => {
    const d = document.createElement('div');
    d.className = 'card' + (c.open ? ' open' : '') + (c.done ? ' done' : '');
    d.textContent = (c.open || c.done) ? c.v : '❓';
    d.onclick = () => pickCard(idx);
    g.appendChild(d);
  });
}

function pickCard(idx) {
  if (locked || cards[idx].open || cards[idx].done) return;
  cards[idx].open = true;
  open.push(idx);
  render();
  if (open.length === 2) {
    moves++; locked = true;
    const [a, b] = open;
    if (cards[a].v === cards[b].v) {
      cards[a].done = cards[b].done = true;
      open = []; locked = false; matched++;
      if (matched === totalPairs) {
        clearInterval(timer);
        document.getElementById('msg').textContent = `🎉 Tamamlandı! ${moves} hamle ve ${secs} saniye!`;
      }
      render();
    } else {
      setTimeout(() => {
        cards[a].open = cards[b].open = false;
        open = []; locked = false;
        render();
      }, 600);
    }
  }
}

document.getElementById('szSel').onchange = start;
document.getElementById('newBtn').onclick = start;
start();
</script>
</body>
</html>
