<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Klasik Tetris - Gekkotari</title>
<style>
  :root { --bg:#0b1120; --panel:#131c31; --bd:rgba(255,255,255,0.12); --acc:#2ee57a; --txt:#f8fafc; --mut:#94a3b8; }
  * { box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:4px; width:100%; height:100%; background:radial-gradient(circle at top,#172544 0%,var(--bg) 78%); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
  .shell { width:min(98vw,460px); max-height:98vh; background:var(--panel); border:1px solid var(--bd); border-radius:14px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; box-shadow:0 20px 50px rgba(0,0,0,0.48); }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .brand { font-weight:800; font-size:0.95rem; color:#38bdf8; }
  button { font-family:inherit; font-weight:700; font-size:0.74rem; border-radius:8px; border:1px solid var(--bd); background:#1a2540; color:var(--txt); padding:5px 9px; cursor:pointer; }
  .btn-go { background:linear-gradient(135deg,#2ee57a,#16a34a); color:#052211; border:none; }
  .stage { display:flex; gap:10px; justify-content:center; align-items:flex-start; }
  canvas#cv { height:min(58vh,300px); width:auto; background:#070d19; border:2px solid #243356; border-radius:8px; }
  .side { display:flex; flex-direction:column; gap:6px; min-width:92px; }
  .box { background:rgba(255,255,255,0.04); border:1px solid var(--bd); border-radius:9px; padding:6px 8px; text-align:center; font-size:0.75rem; }
  .box strong { display:block; font-size:1rem; color:var(--acc); }
  canvas#nxt { width:64px; height:64px; margin:2px auto 0; display:block; background:#091020; border-radius:6px; }
  .tbar { display:flex; gap:5px; justify-content:center; }
  .tbar button { padding:6px 11px; font-size:0.85rem; }
  .foot { text-align:center; font-size:0.7rem; color:var(--mut); }
</style>
</head>
<body>
<div class="shell">
  <div class="hud">
    <span class="brand">🧱 Klasik Tetris</span>
    <button id="newBtn" class="btn-go" type="button">↻ Yeni Oyun</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="200" height="400"></canvas>
    <div class="side">
      <div class="box">Sonraki<canvas id="nxt" width="80" height="80"></canvas></div>
      <div class="box">Skor<strong id="sc">0</strong></div>
      <div class="box">Satır<strong id="ln">0</strong></div>
      <div class="box">Seviye<strong id="lv">1</strong></div>
    </div>
  </div>
  <div class="tbar">
    <button type="button" onclick="move(-1)">◀</button>
    <button type="button" onclick="rot()">⟳ Döndür</button>
    <button type="button" onclick="drop()">⬇ İndir</button>
    <button type="button" onclick="move(1)">▶</button>
  </div>
  <div class="foot" id="msg">Ok tuşları / WASD ile oyna, Yukarı/W ile döndür, Space ile bırak!</div>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const ncv = document.getElementById('nxt'), nctx = ncv.getContext('2d');
const W = 10, H = 20, SZ = 20;
const COLORS = ['', '#22d3ee', '#3b82f6', '#fb923c', '#facc15', '#2ee57a', '#a855f7', '#ef4444'];
const SHAPES = [
  [],
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]]
];
let grid, cur, nextId, score, lines, lvl, timer, lastDrop = 0, over = false;

function mkPiece(id) {
  const m = SHAPES[id].map(r => r.slice());
  return { m, x: Math.floor((W - m[0].length) / 2), y: 0 };
}

function collide(p, ox = 0, oy = 0, mat = p.m) {
  for (let r = 0; r < mat.length; r++) for (let c = 0; c < mat[r].length; c++) {
    if (!mat[r][c]) continue;
    const nx = p.x + c + ox, ny = p.y + r + oy;
    if (nx < 0 || nx >= W || ny >= H || (ny >= 0 && grid[ny][nx])) return true;
  }
  return false;
}

function merge() {
  cur.m.forEach((row, r) => row.forEach((v, c) => { if (v && cur.y + r >= 0) grid[cur.y + r][cur.x + c] = v; }));
  let cleared = 0;
  for (let r = H - 1; r >= 0; r--) {
    if (grid[r].every(Boolean)) { grid.splice(r, 1); grid.unshift(Array(W).fill(0)); cleared++; r++; }
  }
  if (cleared) {
    lines += cleared;
    score += [0, 100, 300, 500, 800][cleared] * lvl;
    lvl = Math.floor(lines / 10) + 1;
    document.getElementById('sc').textContent = score;
    document.getElementById('ln').textContent = lines;
    document.getElementById('lv').textContent = lvl;
  }
  cur = mkPiece(nextId);
  nextId = 1 + Math.floor(Math.random() * 7);
  drawNext();
  if (collide(cur)) { over = true; document.getElementById('msg').textContent = `Oyun Bitti! Skor: ${score}`; }
}

window.move = (dx) => { if (!over && !collide(cur, dx, 0)) { cur.x += dx; draw(); } };
window.rot = () => {
  if (over) return;
  const rotM = cur.m[0].map((_, c) => cur.m.map(row => row[c]).reverse());
  for (const kick of [0, -1, 1, -2, 2]) {
    if (!collide(cur, kick, 0, rotM)) { cur.m = rotM; cur.x += kick; draw(); return; }
  }
};
window.drop = () => {
  if (over) return;
  while (!collide(cur, 0, 1)) { cur.y++; score += 1; }
  document.getElementById('sc').textContent = score;
  merge(); draw();
};

function drawNext() {
  nctx.fillStyle = '#091020'; nctx.fillRect(0, 0, 80, 80);
  const m = SHAPES[nextId], sz = 16;
  const ox = (80 - m[0].length * sz) / 2, oy = (80 - m.length * sz) / 2;
  m.forEach((row, r) => row.forEach((v, c) => {
    if (!v) return;
    nctx.fillStyle = COLORS[v];
    nctx.fillRect(ox + c * sz + 1, oy + r * sz + 1, sz - 2, sz - 2);
  }));
}

function draw() {
  ctx.fillStyle = '#070d19'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (grid[r][c]) {
      ctx.fillStyle = COLORS[grid[r][c]];
      ctx.fillRect(c * SZ + 1, r * SZ + 1, SZ - 2, SZ - 2);
    }
  }
  cur.m.forEach((row, r) => row.forEach((v, c) => {
    if (!v) return;
    ctx.fillStyle = COLORS[v];
    ctx.fillRect((cur.x + c) * SZ + 1, (cur.y + r) * SZ + 1, SZ - 2, SZ - 2);
  }));
}

function tick(ts = 0) {
  if (!over) {
    const interval = Math.max(120, 680 - (lvl - 1) * 55);
    if (ts - lastDrop > interval) {
      if (!collide(cur, 0, 1)) cur.y++; else merge();
      lastDrop = ts; draw();
    }
  }
  timer = requestAnimationFrame(tick);
}

function start() {
  if (timer) cancelAnimationFrame(timer);
  grid = Array.from({ length: H }, () => Array(W).fill(0));
  score = 0; lines = 0; lvl = 1; over = false; lastDrop = 0;
  document.getElementById('sc').textContent = '0';
  document.getElementById('ln').textContent = '0';
  document.getElementById('lv').textContent = '1';
  document.getElementById('msg').textContent = 'Satırları tamamla, blokları zirveye taşırma!';
  cur = mkPiece(1 + Math.floor(Math.random() * 7));
  nextId = 1 + Math.floor(Math.random() * 7);
  drawNext(); draw();
  timer = requestAnimationFrame(tick);
}

window.addEventListener('keydown', e => {
  if (over) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); move(-1); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); move(1); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); rot(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (!collide(cur, 0, 1)) { cur.y++; draw(); } }
  else if (e.code === 'Space') { e.preventDefault(); drop(); }
});
document.getElementById('newBtn').onclick = start;
start();
</script>
</body>
</html>
