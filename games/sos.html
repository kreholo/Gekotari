<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOS Oyunu - Gekkotari</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #131c31;
    --cell: #1c2845;
    --cell-hover: #25365c;
    --p1: #2ee57a;
    --p2: #38bdf8;
    --accent: #facc15;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 6px; width: 100%; min-height: 100%;
    background: radial-gradient(circle at top, #172544 0%, var(--bg) 75%);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow-y: auto; overflow-x: hidden;
  }
  .game-shell {
    width: min(96vw, 540px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 11px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; gap: 5px;
  }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .brand { font-weight: 800; font-size: 1.15rem; letter-spacing: 0.5px; color: var(--p1); display: flex; align-items: center; gap: 8px; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  select, button {
    font-family: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--border);
    background: #1a2540; color: var(--text); padding: 6px 10px; font-size: 0.84rem; cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
  }
  button:hover, select:hover { background: #243356; border-color: rgba(255,255,255,0.25); }
  button:active { transform: scale(0.97); }
  .btn-new { background: linear-gradient(135deg, #2ee57a, #16a34a); color: #062111; border: none; font-weight: 800; }
  .btn-new:hover { background: linear-gradient(135deg, #4ade80, #22c55e); }
  .scoreboard {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
  }
  .player-box {
    background: rgba(255,255,255,0.04); border: 2px solid transparent; border-radius: 10px;
    padding: 4px 10px; display: flex; align-items: center; justify-content: space-between;
    transition: all 0.2s;
  }
  .player-box.active-p1 { border-color: var(--p1); background: rgba(46,229,122,0.1); }
  .player-box.active-p2 { border-color: var(--p2); background: rgba(56,189,248,0.1); }
  .p-name { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .p-score { font-size: 1.15rem; font-weight: 800; }
  .p1-color { color: var(--p1); }
  .p2-color { color: var(--p2); }
  .letter-picker {
    display: flex; gap: 4px; background: rgba(0,0,0,0.28); padding: 3px; border-radius: 10px;
  }
  .letter-btn {
    width: 38px; height: 32px; font-size: 1rem; font-weight: 900; border: none; border-radius: 8px;
    background: transparent; color: var(--muted);
  }
  .letter-btn.selected { background: var(--accent); color: #0b1120; box-shadow: 0 2px 10px rgba(250,204,21,0.35); }
  .status-line {
    text-align: center; font-size: 0.82rem; font-weight: 600; color: var(--accent); min-height: 18px;
  }
  .board-wrap {
    position: relative; width: 100%; display: flex; justify-content: center; align-items: center;
  }
  .board {
    display: grid; gap: 4px; width: min(100%, 242px); aspect-ratio: 1 / 1; position: relative;
  }
  .cell {
    background: var(--cell); border: 1px solid rgba(255,255,255,0.08); border-radius: 9px;
    display: flex; align-items: center; justify-content: center; font-weight: 900;
    cursor: pointer; transition: background 0.12s, transform 0.1s; position: relative;
  }
  .cell:hover:not(.filled) { background: var(--cell-hover); transform: translateY(-1px); }
  .cell.filled { cursor: default; }
  .cell.owner-1 { color: var(--p1); }
  .cell.owner-2 { color: var(--p2); }
  .cell.win-cell { box-shadow: inset 0 0 0 2px rgba(250,204,21,0.85); background: rgba(250,204,21,0.16); }
  .footer-hint { text-align: center; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="game-shell">
  <div class="top-bar">
    <div class="brand">SOS • Gekkotari</div>
    <div class="controls">
      <select id="modeSel" aria-label="Oyun Modu">
        <option value="ai-hard" selected>Bilgisayara Karşı (Zor)</option>
        <option value="ai-easy">Bilgisayara Karşı (Kolay)</option>
        <option value="pvp">2 Kişilik (Arkadaşınla)</option>
      </select>
      <select id="sizeSel" aria-label="Tahta Boyutu">
        <option value="5">5 × 5</option>
        <option value="7" selected>7 × 7</option>
        <option value="9">9 × 9</option>
      </select>
      <button class="btn-new" id="resetBtn">Yeni Oyun</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="player-box active-p1" id="boxP1">
      <span class="p-name" id="labelP1">Oyuncu 1</span>
      <span class="p-score p1-color" id="scoreP1">0</span>
    </div>
    <div class="letter-picker" title="Koyulacak harfi seç">
      <button class="letter-btn selected" id="pickS" type="button">S</button>
      <button class="letter-btn" id="pickO" type="button">O</button>
    </div>
    <div class="player-box" id="boxP2">
      <span class="p-name" id="labelP2">Bot</span>
      <span class="p-score p2-color" id="scoreP2">0</span>
    </div>
  </div>

  <div class="status-line" id="statusLine">Sıra Oyuncu 1'de — Harfini seç ve bir kareye tıkla!</div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="footer-hint">Kural: Yatay, dikey veya çapraz "S-O-S" oluşturan +1 puan ve ekstra hamle kazanır!</div>
</div>

<script>
(() => {
  const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  let size = 7;
  let mode = 'ai-hard';
  let board = [];
  let owners = [];
  let winCells = new Set();
  let scoredTriples = new Set();
  let turn = 1;
  let selectedLetter = 'S';
  let scores = { 1: 0, 2: 0 };
  let filledCount = 0;
  let aiLock = false;

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('statusLine');
  const scoreP1 = document.getElementById('scoreP1');
  const scoreP2 = document.getElementById('scoreP2');
  const boxP1 = document.getElementById('boxP1');
  const boxP2 = document.getElementById('boxP2');
  const labelP1 = document.getElementById('labelP1');
  const labelP2 = document.getElementById('labelP2');
  const pickS = document.getElementById('pickS');
  const pickO = document.getElementById('pickO');

  function setLetter(l) {
    selectedLetter = l;
    pickS.classList.toggle('selected', l === 'S');
    pickO.classList.toggle('selected', l === 'O');
  }
  pickS.onclick = () => setLetter('S');
  pickO.onclick = () => setLetter('O');

  document.addEventListener('keydown', (e) => {
    if (e.key === 's' || e.key === 'S') setLetter('S');
    if (e.key === 'o' || e.key === 'O') setLetter('O');
  });

  function inBounds(r, c) {
    return r >= 0 && r < size && c >= 0 && c < size;
  }

  function findNewSos(r, c, testBoard, existingSet) {
    const ch = testBoard[r][c];
    const found = [];
    for (const [dr, dc] of DIRS) {
      if (ch === 'O') {
        const r1 = r - dr, c1 = c - dc;
        const r2 = r + dr, c2 = c + dc;
        if (inBounds(r1,c1) && inBounds(r2,c2) && testBoard[r1][c1] === 'S' && testBoard[r2][c2] === 'S') {
          const key = [[r1,c1],[r,c],[r2,c2]].map(x=>x.join(',')).sort().join('|');
          if (!existingSet.has(key)) found.push({ key, cells: [[r1,c1],[r,c],[r2,c2]] });
        }
      } else if (ch === 'S') {
        for (const sgn of [1, -1]) {
          const rm = r + sgn * dr, cm = c + sgn * dc;
          const re = r + 2 * sgn * dr, ce = c + 2 * sgn * dc;
          if (inBounds(rm,cm) && inBounds(re,ce) && testBoard[rm][cm] === 'O' && testBoard[re][ce] === 'S') {
            const key = [[r,c],[rm,cm],[re,ce]].map(x=>x.join(',')).sort().join('|');
            if (!existingSet.has(key)) found.push({ key, cells: [[r,c],[rm,cm],[re,ce]] });
          }
        }
      }
    }
    return found;
  }

  function updateUI() {
    scoreP1.textContent = scores[1];
    scoreP2.textContent = scores[2];
    labelP1.textContent = mode === 'pvp' ? 'Oyuncu 1' : 'Sen';
    labelP2.textContent = mode === 'pvp' ? 'Oyuncu 2' : 'Bot';
    boxP1.classList.toggle('active-p1', turn === 1 && filledCount < size * size);
    boxP2.classList.toggle('active-p2', turn === 2 && filledCount < size * size);

    const cellFont = size === 5 ? '1.85rem' : size === 7 ? '1.35rem' : '1.05rem';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const idx = r * size + c;
        const cell = boardEl.children[idx];
        cell.style.fontSize = cellFont;
        cell.textContent = board[r][c] || '';
        cell.className = 'cell';
        if (board[r][c]) {
          cell.classList.add('filled', owners[r][c] === 1 ? 'owner-1' : 'owner-2');
        }
        if (winCells.has(`${r},${c}`)) cell.classList.add('win-cell');
      }
    }

    if (filledCount >= size * size) {
      if (scores[1] > scores[2]) statusEl.textContent = `Oyun Bitti! ${labelP1.textContent} kazandı (${scores[1]} - ${scores[2]})!`;
      else if (scores[2] > scores[1]) statusEl.textContent = `Oyun Bitti! ${labelP2.textContent} kazandı (${scores[2]} - ${scores[1]})!`;
      else statusEl.textContent = `Oyun Bitti! Berabere (${scores[1]} - ${scores[2]})!`;
    } else if (turn === 2 && mode !== 'pvp') {
      statusEl.textContent = 'Bot düşünüyor...';
    } else {
      statusEl.textContent = `Sıra ${turn === 1 ? labelP1.textContent : labelP2.textContent} oyuncuda (Seçili: ${selectedLetter})`;
    }
  }

  function makeMove(r, c, letter) {
    if (board[r][c] || filledCount >= size * size) return false;
    board[r][c] = letter;
    owners[r][c] = turn;
    filledCount++;
    const hits = findNewSos(r, c, board, scoredTriples);
    if (hits.length > 0) {
      scores[turn] += hits.length;
      for (const h of hits) {
        scoredTriples.add(h.key);
        for (const [hr, hc] of h.cells) winCells.add(`${hr},${hc}`);
      }
      // Extra turn on SOS!
    } else {
      turn = turn === 1 ? 2 : 1;
    }
    updateUI();
    if (filledCount < size * size && turn === 2 && mode !== 'pvp') {
      aiLock = true;
      setTimeout(runAiMove, 320);
    }
    return true;
  }

  function givesOpponentChance(r, c, letter) {
    board[r][c] = letter;
    let danger = 0;
    for (let nr = Math.max(0, r - 2); nr <= Math.min(size - 1, r + 2); nr++) {
      for (let nc = Math.max(0, c - 2); nc <= Math.min(size - 1, c + 2); nc++) {
        if (board[nr][nc]) continue;
        for (const l2 of ['S', 'O']) {
          board[nr][nc] = l2;
          if (findNewSos(nr, nc, board, scoredTriples).length > 0) danger++;
          board[nr][nc] = '';
        }
      }
    }
    board[r][c] = '';
    return danger;
  }

  function runAiMove() {
    aiLock = false;
    if (filledCount >= size * size || turn !== 2) return;
    const empties = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (!board[r][c]) empties.push([r, c]);
      }
    }
    if (!empties.length) return;

    // 1. Always take an immediate scoring SOS move if available (in hard mode, or 75% in easy mode)
    let bestScoreMove = null;
    let bestHits = 0;
    for (const [r, c] of empties) {
      for (const l of ['S', 'O']) {
        board[r][c] = l;
        const hits = findNewSos(r, c, board, scoredTriples).length;
        board[r][c] = '';
        if (hits > bestHits) {
          bestHits = hits;
          bestScoreMove = [r, c, l];
        }
      }
    }
    if (bestScoreMove && (mode === 'ai-hard' || Math.random() < 0.7)) {
      makeMove(...bestScoreMove);
      return;
    }

    if (mode === 'ai-hard') {
      // Pick safe moves that don't hand opponent an immediate SOS
      const safeMoves = [];
      for (const [r, c] of empties) {
        for (const l of ['S', 'O']) {
          if (givesOpponentChance(r, c, l) === 0) safeMoves.push([r, c, l]);
        }
      }
      if (safeMoves.length) {
        const pick = safeMoves[Math.floor(Math.random() * safeMoves.length)];
        makeMove(...pick);
        return;
      }
    }

    const [rr, rc] = empties[Math.floor(Math.random() * empties.length)];
    const rl = Math.random() < 0.5 ? 'S' : 'O';
    makeMove(rr, rc, rl);
  }

  function initGame() {
    size = parseInt(document.getElementById('sizeSel').value, 10) || 7;
    mode = document.getElementById('modeSel').value || 'ai-hard';
    board = Array.from({ length: size }, () => Array(size).fill(''));
    owners = Array.from({ length: size }, () => Array(size).fill(0));
    winCells = new Set();
    scoredTriples = new Set();
    turn = 1;
    scores = { 1: 0, 2: 0 };
    filledCount = 0;
    aiLock = false;

    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    boardEl.innerHTML = '';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const btn = document.createElement('div');
        btn.className = 'cell';
        btn.onclick = () => {
          if (aiLock || (turn === 2 && mode !== 'pvp')) return;
          makeMove(r, c, selectedLetter);
        };
        boardEl.appendChild(btn);
      }
    }
    updateUI();
  }

  document.getElementById('resetBtn').onclick = initGame;
  document.getElementById('modeSel').onchange = initGame;
  document.getElementById('sizeSel').onchange = initGame;
  initGame();
})();
</script>
</body>
</html>
