<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gekkotari — Ateş ve Su 1-5, Çağlar Boyu Savaş 1-2, Papa's Pizzeria serisi, Stick War, Feodalizm, Earn to Die, Jacksmith, Swords and Sandals ve 200+ ücretsiz HTML5 & Flash oyunu kurulumsuz hemen oyna!">
    <meta name="keywords" content="flash oyunlar, html5 oyunlar, gekkotari, ateş ve su, çağlar boyu savaş, papa's pizzeria, stick war, earn to die, feodalizm, swords and sandals, jacksmith, kingdom rush, strike force heroes, snail bob, sos oyunu, xox oyunu">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://gekotari.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Gekkotari">
    <meta property="og:locale" content="tr_TR">
    <meta property="og:title" content="Gekkotari — Ücretsiz Flash & HTML5 Oyun Portalı">
    <meta property="og:description" content="Kurulumsuz ve reklamsız 200+ doğrulanmış Flash & HTML5 oyunu tek adreste oyna!">
    <meta property="og:url" content="https://gekotari.vercel.app/">
    <meta property="og:image" content="https://gekotari.vercel.app/assets/icon-192.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#2ee57a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icon-192.svg">
    <link rel="preconnect" href="https://rltpodnczpcwnefovitz.supabase.co" crossorigin>
    <link rel="preconnect" href="https://img.gamedistribution.com" crossorigin>
    <title>Gekkotari — Ücretsiz Flash & HTML5 Oyun Portalı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=10">
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Gekkotari","url":"https://gekotari.vercel.app/","potentialAction":{"@type":"SearchAction","target":"https://gekotari.vercel.app/kategori.html?arama={search_term_string}","query-input":"required name=search_term_string"}}</script>
</head>
<body>

<div id="siteHeaderMount"></div>

<main class="container-xl my-4">
    <!-- HERO + GÜNÜN OYUNU -->
    <div class="row g-3 mb-4 align-items-stretch">
        <div class="col-lg-8">
            <section class="hero-slider h-100" id="sliderSection"></section>
        </div>
        <div class="col-lg-4">
            <aside class="daily-spotlight-card" id="dailySpotlightMount"></aside>
        </div>
    </div>

    <!-- HIZLI MODLAR & KATEGORİLER -->
    <section class="mb-4">
        <div class="mode-chips-bar mb-2" id="quickModesBar"></div>
        <div class="d-flex flex-wrap gap-2" id="categoryBadgesArea"></div>
    </section>

    <!-- SON OYNADIKLARIN (Varsa otomatik açılır) -->
    <section class="mb-4" id="recentSection" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="section-title mb-0"><i class="fas fa-history"></i> Kaldığın Yerden Devam Et</h3>
            <button onclick="temizleSonOynanan()" class="btn btn-sm btn-outline-secondary" style="font-size:0.75rem;">Temizle</button>
        </div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="recentGamesGrid"></div>
    </section>

    <!-- ANA SAYFA REKLAM ALANI (728x90 Leaderboard) -->
    <section class="my-4" id="homeLeaderboardAd"></section>

    <!-- EFSANE SERİLER & KLASİKLER -->
    <section class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="section-title mb-0"><i class="fas fa-crown"></i> Efsane Seriler & Flash Klasikler</h3>
            <a href="kategori.html?siralama=populer" class="text-muted small">Tümünü Gör <i class="fas fa-chevron-right ms-1"></i></a>
        </div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="classicGamesGrid"></div>
    </section>

    <!-- POPÜLER HTML5 OYUNLAR -->
    <section class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="section-title mb-0"><i class="fas fa-fire"></i> Popüler HTML5 Oyunlar</h3>
            <a href="kategori.html" class="text-muted small">Tümünü Gör <i class="fas fa-chevron-right ms-1"></i></a>
        </div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="popularGamesGrid"></div>
    </section>

    <!-- YENİ EKLENENLER -->
    <section class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="section-title mb-0"><i class="fas fa-bolt"></i> Öne Çıkan Yeniler</h3>
            <a href="kategori.html?siralama=yeni" class="text-muted small">Tümünü Gör <i class="fas fa-chevron-right ms-1"></i></a>
        </div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="newGamesGrid"></div>
    </section>
</main>

<div id="siteFooterMount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ads-config.js?v=9"></script>
<script src="assets/js/supabase-sync.js?v=9"></script>
<script src="assets/js/games-data.js?v=12"></script>
<script src="assets/js/common.js?v=9"></script>
<script>
function temizleSonOynanan() {
    localStorage.removeItem('gekkotari_recent');
    document.getElementById('recentSection').style.display = 'none';
    showToast('info', 'Son oynananlar geçmişi temizlendi.');
}

document.addEventListener('DOMContentLoaded', () => {
    renderHeader('index.html');
    renderFooter();
    renderAdSlot('homeLeaderboardAd', 'home_leaderboard');

    const games = getGames().filter(g => String(g.durum) !== '0');
    const categories = getCategories();
    const sliders = getSliders();

    // 1. Slider
    const sliderSec = document.getElementById('sliderSection');
    if (sliders.length > 0) {
        const indicators = sliders.map((s, i) =>
            `<button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="${i}" ${i === 0 ? 'class="active"' : ''}></button>`
        ).join('');
        const slides = sliders.map((s, i) => `
            <div class="carousel-item h-100 ${i === 0 ? 'active' : ''}">
                <div class="hero-slide h-100" style="background: radial-gradient(circle at 82% 25%, rgba(46,229,122,0.18), var(--bg-dark) 58%, var(--bg-darker) 100%);">
                    <div class="hero-content">
                        <span class="badge bg-success mb-2"><i class="fas fa-star me-1"></i>ÖNE ÇIKAN</span>
                        <h2>${escapeHtml(s.baslik)}</h2>
                        <p>${escapeHtml(s.aciklama)}</p>
                        <div class="d-flex gap-2 flex-wrap">
                            <a href="${escapeHtml(s.link || 'kategori.html')}" class="btn btn-primary-custom px-4">
                                <i class="fas fa-play me-2"></i>Keşfet
                            </a>
                            <button onclick="rastgeleOyunAc()" class="btn btn-outline-light px-3">
                                <i class="fas fa-dice me-2"></i>Şansımı Dene
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');

        sliderSec.innerHTML = `
            <div id="heroCarousel" class="carousel slide h-100 d-flex flex-column justify-content-between" data-bs-ride="carousel" data-bs-interval="5500">
                <div class="carousel-inner flex-grow-1">${slides}</div>
                <div class="carousel-indicators" style="position:static;margin:0;padding:8px 0 12px;">${indicators}</div>
                ${sliders.length > 1 ? `
                <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>` : ''}
            </div>
        `;
    }

    // 2. Günün Oyunu Kartı
    const daily = getDailyGame(games);
    const dailyEl = document.getElementById('dailySpotlightMount');
    if (daily && dailyEl) {
        const hasImg = daily.gorsel && (daily.gorsel.startsWith('http') || daily.gorsel.startsWith('assets/'));
        dailyEl.innerHTML = `
            <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge bg-success"><i class="fas fa-calendar-day me-1"></i>GÜNÜN OYUNU</span>
                    ${Number(daily.puan || 0) > 0 ? `<span class="small fw-bold" style="color:var(--warning);"><i class="fas fa-star me-1"></i>${Number(daily.puan).toFixed(1)}</span>` : ''}
                </div>
                <div class="d-flex gap-3 align-items-center mb-3">
                    <div style="width:92px;height:68px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--bg-darker);border:1px solid var(--border-color);display:flex;align-items:center;justify-content:center;position:relative;">
                        <i class="${escapeHtml(getGameIcon(daily))} fa-2x" style="color:var(--primary);"></i>
                        ${hasImg
                            ? `<img src="${escapeHtml(daily.gorsel)}" alt="${escapeHtml(daily.oyun_adi)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';">`
                            : ''}
                    </div>
                    <div class="overflow-hidden">
                        <h5 class="mb-1 text-white fw-bold text-truncate">${escapeHtml(daily.oyun_adi)}</h5>
                        <div class="small text-muted">${escapeHtml(daily.kategori_adi)}</div>
                    </div>
                </div>
                <p class="small text-muted mb-3" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                    ${escapeHtml(daily.aciklama || 'Bugünün öne çıkan doğrulanmış oyununu hemen dene!')}
                </p>
            </div>
            <a href="oyun.html?id=${daily.id}" class="btn btn-primary-custom w-100">
                <i class="fas fa-play me-2"></i>Bugünün Oyununu Oyna
            </a>
        `;
    }

    // 3. Hızlı Mod Çipleri & Kategoriler
    const quickModes = [
        { key: '2 Kişilik', icon: 'fas fa-user-friends', label: '2 Kişilik Kapışma' },
        { key: 'Hızlı', icon: 'fas fa-stopwatch', label: '5 Dk Molalık' },
        { key: 'Zeka', icon: 'fas fa-brain', label: 'Zeka & Bulmaca' },
        { key: 'Flash', icon: 'fas fa-bolt', label: 'Flash Efsaneler' },
        { key: 'Mobil Uyumlu', icon: 'fas fa-mobile-alt', label: 'Telefondan Oyna' }
    ];
    document.getElementById('quickModesBar').innerHTML =
        `<span class="small text-muted fw-semibold me-1"><i class="fas fa-sliders-h me-1" style="color:var(--primary);"></i>Modlar:</span>` +
        quickModes.map(m => `<a href="kategori.html?mod=${encodeURIComponent(m.key)}" class="mode-chip"><i class="${m.icon}"></i>${m.label}</a>`).join('');

    const catArea = document.getElementById('categoryBadgesArea');
    catArea.innerHTML = `<a href="kategori.html" class="filter-btn active"><i class="fas fa-th me-1"></i>Tümü <span class="badge bg-dark ms-1">${games.length}</span></a>` +
        categories.map(kat => {
            const count = games.filter(g => g.kategori_adi === kat.kategori_adi).length;
            if (!count) return '';
            return `<a href="kategori.html?tur=${encodeURIComponent(kat.kategori_adi)}" class="filter-btn">
                <i class="${escapeHtml(kat.ikon)} me-1"></i>
                ${escapeHtml(kat.kategori_adi)}
                <span class="badge bg-dark ms-1">${count}</span>
            </a>`;
        }).join('');

    // 4. Son Oynadıkların
    const recents = getRecentGames(5);
    if (recents.length > 0) {
        document.getElementById('recentSection').style.display = 'block';
        document.getElementById('recentGamesGrid').innerHTML = recents.map(g => renderGameCard(g, 'col')).join('');
    }

    // 5-7. Oyun Vitrinleri Render (ve Supabase canlı verisi gelince otomatik güncelleme)
    function renderHomeGrids() {
        const classics = games
            .filter(g => parseInt(g.id, 10) >= 51)
            .sort((a, b) => getGameLiveStat(b).plays - getGameLiveStat(a).plays || parseInt(a.id, 10) - parseInt(b.id, 10))
            .slice(0, 30);
        document.getElementById('classicGamesGrid').innerHTML = classics.map(g => renderGameCard(g, 'col')).join('');

        const popularHtml5 = games
            .filter(g => parseInt(g.id, 10) <= 50)
            .sort((a, b) => getGameLiveStat(b).plays - getGameLiveStat(a).plays || parseInt(a.id, 10) - parseInt(b.id, 10))
            .slice(0, 10);
        document.getElementById('popularGamesGrid').innerHTML = popularHtml5.map(g => renderGameCard(g, 'col')).join('');

        const newest = [...games]
            .sort((a, b) => parseInt(b.id, 10) - parseInt(a.id, 10))
            .slice(0, 15);
        document.getElementById('newGamesGrid').innerHTML = newest.map(g => renderGameCard(g, 'col')).join('');
    }

    renderHomeGrids();
    syncPortalLiveStats(() => {
        renderHomeGrids();
        const rec = getRecentGames(5);
        if (rec.length > 0) {
            document.getElementById('recentGamesGrid').innerHTML = rec.map(g => renderGameCard(g, 'col')).join('');
        }
    });
});
</script>
</body>
</html>
