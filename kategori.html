<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gekkotari oyun arşivi: 2 kişilik, Flash efsaneler, aksiyon, strateji, yarış ve bulmaca oyunlarını filtrele ve ücretsiz oyna.">
    <meta name="keywords" content="tüm flash oyunlar, 2 kişilik oyunlar, html5 oyunlar, aksiyon, strateji, rpg, bulmaca, yarış oyunları, gekkotari">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" id="canonicalLink" href="https://gekkotari.com/kategori.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Gekkotari">
    <meta property="og:locale" content="tr_TR">
    <meta property="og:title" content="Tüm Oyunlar - Gekkotari">
    <meta property="og:description" content="200 doğrulanmış Flash ve HTML5 oyununu filtrele ve hemen oyna!">
    <meta property="og:image" content="https://gekkotari.com/assets/icon-512.png">
    <meta name="theme-color" content="#2ee57a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://rltpodnczpcwnefovitz.supabase.co" crossorigin>
    <link rel="preconnect" href="https://archive.org" crossorigin>
    <title>Tüm Oyunlar - Gekkotari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=14">
    <meta name="google-adsense-account" content="ca-pub-7220337370405776">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7220337370405776" crossorigin="anonymous"></script>
</head>
<body>

<div id="siteHeaderMount"></div>

<main class="container-xl my-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="section-title mb-0" id="pageHeading">
            <i class="fas fa-gamepad"></i> Tüm Oyunlar
        </h2>
        <a href="index.html" class="btn btn-outline-light btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Ana Sayfa
        </a>
    </div>

    <!-- Hızlı Mod Çipleri -->
    <div class="mode-chips-bar mb-2" id="modeFilterBar"></div>

    <!-- Kategori Filtreleri -->
    <div class="category-filter-bar" id="categoryFilterBar"></div>

    <!-- Sıralama ve Arama -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2 flex-wrap" id="sortButtonsArea"></div>
        <form id="inlineSearchForm" class="d-flex gap-2">
            <input type="text" id="inlineSearchInput" class="form-control form-control-sm"
                   style="width:230px;" placeholder="Oyun adı ara...">
            <button class="btn btn-sm btn-success" type="submit"><i class="fas fa-search"></i></button>
        </form>
    </div>

    <!-- Kategori Reklam Alanı (728x90 Leaderboard) -->
    <div class="my-3" id="categoryLeaderboardAd"></div>

    <!-- Oyun Listesi (5'li rahat ızgara) -->
    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="gamesListContainer"></div>

    <!-- Sayfalama -->
    <nav class="mt-4 d-flex justify-content-center" id="paginationContainer"></nav>
</main>

<div id="siteFooterMount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ads-config.js?v=13"></script>
<script src="assets/js/supabase-sync.js?v=12"></script>
<script src="assets/js/games-data.js?v=19"></script>
<script src="assets/js/common.js?v=17"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderHeader('kategori.html');
    renderFooter();
    renderAdSlot('categoryLeaderboardAd', 'category_leaderboard');

    const params = new URLSearchParams(window.location.search);
    let secilenTur = params.get('tur') || '';
    let secilenMod = params.get('mod') || '';
    let arama = params.get('arama') || '';
    let siralama = params.get('siralama') || 'populer';
    let sayfa = Math.max(1, parseInt(params.get('sayfa') || '1', 10));
    const perSayfa = 25;

    const searchInput = document.getElementById('inlineSearchInput');
    searchInput.value = arama;

    function buildQuery(overrides = {}) {
        const q = new URLSearchParams();
        const tur = overrides.hasOwnProperty('tur') ? overrides.tur : secilenTur;
        const mod = overrides.hasOwnProperty('mod') ? overrides.mod : secilenMod;
        const ar = overrides.hasOwnProperty('arama') ? overrides.arama : arama;
        const sir = overrides.hasOwnProperty('siralama') ? overrides.siralama : siralama;
        const pg = overrides.hasOwnProperty('sayfa') ? overrides.sayfa : 1;
        if (tur) q.set('tur', tur);
        if (mod) q.set('mod', mod);
        if (ar) q.set('arama', ar);
        if (sir) q.set('siralama', sir);
        if (pg > 1) q.set('sayfa', String(pg));
        return 'kategori.html' + (q.toString() ? '?' + q.toString() : '');
    }

    function updateView() {
        const allGames = getGames().filter(g => String(g.durum) !== '0');
        const categories = getCategories();

        let filtered = allGames.filter(g => {
            if (secilenTur && g.kategori_adi !== secilenTur) return false;
            if (secilenMod) {
                const mods = Array.isArray(g.modlar) ? g.modlar : [];
                if (secilenMod === 'Flash') {
                    if (!(g.oyun_linki || '').toLowerCase().endsWith('.swf')) return false;
                } else if (secilenMod === 'HTML5') {
                    if ((g.oyun_linki || '').toLowerCase().endsWith('.swf')) return false;
                } else if (secilenMod === 'Mobil Uyumlu') {
                    if (!mods.includes('Mobil Uyumlu') && !mods.includes('Mobil')) return false;
                } else {
                    if (!mods.includes(secilenMod)) return false;
                }
            }
            if (arama) {
                const q = normalizeTr(arama.trim());
                const hay = normalizeTr(
                    [g.oyun_adi, g.aciklama, g.kategori_adi, g.etiket, g.seri, g.anahtar_kelimeler].filter(Boolean).join(' ')
                );
                const tokens = q.split(/\s+/).filter(Boolean);
                if (!tokens.every(tok => hay.includes(tok))) return false;
            }
            return true;
        });

        filtered.sort((a, b) => {
            if (siralama === 'populer') return getGameLiveStat(b).plays - getGameLiveStat(a).plays || parseInt(b.id, 10) - parseInt(a.id, 10);
            if (siralama === 'puan') return getGameLiveStat(b).rating - getGameLiveStat(a).rating || parseInt(b.id, 10) - parseInt(a.id, 10);
            if (siralama === 'isim') return (a.oyun_adi || '').localeCompare(b.oyun_adi || '', 'tr');
            return parseInt(b.id, 10) - parseInt(a.id, 10);
        });

        let titleText = 'Tüm Oyunlar';
        if (secilenTur) titleText = secilenTur + ' Oyunları';
        if (secilenMod) titleText = (secilenTur ? secilenTur + ' • ' : '') + secilenMod + ' Oyunları';
        if (arama) titleText = 'Arama: "' + arama + '"';
        document.getElementById('pageHeading').innerHTML = `
            <i class="fas fa-gamepad"></i> ${escapeHtml(titleText)}
            <small class="text-muted fs-6 ms-2">(${filtered.length} oyun)</small>
        `;
        document.title = titleText + ' - Gekkotari';
        const canon = document.getElementById('canonicalLink');
        if (canon) canon.href = window.location.origin + '/' + buildQuery();
        const ogT = document.querySelector('meta[property="og:title"]');
        if (ogT) ogT.content = document.title;

        // Mod çipleri
        const modes = [
            { key: '', icon: 'fas fa-border-all', label: 'Hepsi' },
            { key: '2 Kişilik', icon: 'fas fa-user-friends', label: '2 Kişilik' },
            { key: 'HTML5', icon: 'fab fa-html5', label: 'HTML5 Oyunlar' },
            { key: 'Flash', icon: 'fas fa-bolt', label: 'Flash Klasik' },
            { key: 'Mobil Uyumlu', icon: 'fas fa-mobile-alt', label: 'Mobil Uyumlu' },
            { key: 'Hızlı', icon: 'fas fa-stopwatch', label: '5 Dk Molalık' },
            { key: 'Zeka', icon: 'fas fa-brain', label: 'Zeka & Bulmaca' }
        ];
        document.getElementById('modeFilterBar').innerHTML =
            `<span class="small text-muted fw-semibold me-1">Oynanış Modu:</span>` +
            modes.map(m => `<a href="${buildQuery({ mod: m.key, sayfa: 1 })}" class="mode-chip ${secilenMod === m.key ? 'active' : ''}">
                <i class="${m.icon}"></i>${m.label}
            </a>`).join('');

        // Kategori Filtre Bar
        const catBar = document.getElementById('categoryFilterBar');
        catBar.innerHTML = `<a href="${buildQuery({ tur: '', sayfa: 1 })}" class="filter-btn ${!secilenTur ? 'active' : ''}">
            <i class="fas fa-th me-1"></i> Tüm Kategoriler
        </a>` + categories.map(k => {
            const count = allGames.filter(g => g.kategori_adi === k.kategori_adi).length;
            if (!count) return '';
            return `<a href="${buildQuery({ tur: k.kategori_adi, sayfa: 1 })}" class="filter-btn ${secilenTur === k.kategori_adi ? 'active' : ''}">
                <i class="${escapeHtml(k.ikon)} me-1"></i> ${escapeHtml(k.kategori_adi)}
            </a>`;
        }).join('');

        // Sıralama
        const sorts = [
            { key: 'populer', label: 'Popüler', icon: 'fas fa-fire' },
            { key: 'yeni', label: 'Yeni', icon: 'fas fa-clock' },
            { key: 'puan', label: 'Puan', icon: 'fas fa-star' },
            { key: 'isim', label: 'A-Z', icon: 'fas fa-sort-alpha-down' }
        ];
        document.getElementById('sortButtonsArea').innerHTML = `<span class="text-muted small align-self-center">Sırala:</span>` +
            sorts.map(s => `<a href="${buildQuery({ siralama: s.key, sayfa: 1 })}" class="filter-btn ${siralama === s.key ? 'active' : ''}" style="font-size:0.76rem;padding:5px 12px;">
                <i class="${s.icon} me-1"></i>${s.label}
            </a>`).join('');

        const totalPages = Math.max(1, Math.ceil(filtered.length / perSayfa));
        if (sayfa > totalPages) sayfa = 1;
        const offset = (sayfa - 1) * perSayfa;
        const pageItems = filtered.slice(offset, offset + perSayfa);

        const listEl = document.getElementById('gamesListContainer');
        if (pageItems.length > 0) {
            listEl.innerHTML = pageItems.map(g => renderGameCard(g, 'col')).join('');
        } else {
            if (arama && arama.trim().length >= 2 && window.GekkotariDB && window.GekkotariDB.recordZeroSearch) {
                window.GekkotariDB.recordZeroSearch(arama.trim());
            }
            listEl.innerHTML = `
                <div class="col-12" style="grid-column:1/-1;">
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h4>Oyun Bulunamadı</h4>
                        <p>Farklı bir kategori, mod veya arama terimi deneyin ya da eklenmesini isteyin!</p>
                        <div class="d-flex justify-content-center gap-2 flex-wrap">
                            <a href="kategori.html" class="btn btn-primary-custom">Tüm Oyunları Göster</a>
                            <button type="button" onclick="openFeedbackModal('Oyun İste', ${JSON.stringify(arama || '')})" class="btn btn-outline-success">
                                <i class="fas fa-plus-circle me-1"></i>Bu Oyunu İste
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        const pagEl = document.getElementById('paginationContainer');
        if (totalPages > 1) {
            let pagHtml = '<ul class="pagination">';
            for (let i = 1; i <= totalPages; i++) {
                pagHtml += `<li class="page-item ${sayfa === i ? 'active' : ''}">
                    <a class="page-link" href="${buildQuery({ sayfa: i })}">${i}</a>
                </li>`;
            }
            pagHtml += '</ul>';
            pagEl.innerHTML = pagHtml;
        } else {
            pagEl.innerHTML = '';
        }
    }

    document.getElementById('inlineSearchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        arama = searchInput.value.trim();
        sayfa = 1;
        updateView();
    });

    updateView();
    syncPortalLiveStats(() => updateView());
});
</script>
</body>
</html>
